<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>EAC Delivery — Entregas</title>
<link rel="icon" type="image/svg+xml" href="/logo-eac.svg">
<!--
  Pagina usada em dois enderecos (os textos mudam pelo endereco, ver PAGINAS):
  - /entregas: rosas e botons (conta unica "entrega")
  - /trotes:   trotes (conta unica "trote")
  O admin entra nas duas. Quem faz toca "Estou levando"/"Estou indo"
  (reserva o pedido com o nome dele) e depois "Entregue!"/"Trote feito!".
  Usa as mesmas funcoes do quadro do painel admin, entao ficam sempre iguais.
-->
<style>
  :root {
    --azul: #1e5aa8; --azul-esc: #144079; --amarelo: #f5b301; --amarelo-esc: #c98f00;
    --vermelho: #e53935; --verde: #2e7d32; --creme: #fff8e7; --creme-2: #faf1d7;
    --texto: #2b2b2b; --fraco: #6b6b6b; --borda: #ecdfba;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #f6f9fd 0, var(--creme) 320px, #fffdf7 100%);
    color: var(--texto); min-height: 100vh;
  }
  .oculto { display: none !important; }

  header {
    background: linear-gradient(135deg, var(--azul-esc), var(--azul)); color: #fff;
    padding: 16px 16px 14px; position: relative;
  }
  header .linha { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  header .icone {
    width: 46px; height: 46px; border-radius: 50%; background: #fff; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: .3px; }
  header p { margin: 2px 0 0; font-size: .86rem; opacity: .9; }
  .faixa { height: 5px; background: linear-gradient(90deg, var(--vermelho) 0 25%, var(--amarelo) 25% 50%, #fff 50% 75%, var(--verde) 75% 100%); }
  .quem {
    max-width: 1000px; margin: 10px auto 0; padding: 0 16px; display: flex; gap: 10px; align-items: center;
    justify-content: space-between; flex-wrap: wrap; font-size: .9rem; color: var(--fraco);
  }
  .quem strong { color: var(--azul-esc); }
  .quem a { color: var(--azul); font-weight: 600; text-decoration: none; margin-left: 10px; }

  main { max-width: 1000px; margin: 0 auto; padding: 12px 16px 40px; }

  /* ---------- Login ---------- */
  .login {
    max-width: 380px; margin: 24px auto; background: #fff; border: 1px solid var(--borda);
    border-radius: 14px; padding: 22px; box-shadow: 0 10px 28px rgba(20,64,121,.08);
  }
  .login h2 { margin: 0 0 4px; font-size: 1.15rem; color: var(--azul-esc); text-align: center; }
  .login p { margin: 0 0 16px; color: var(--fraco); font-size: .9rem; text-align: center; }
  .login label { display: block; font-size: .85rem; font-weight: 700; color: var(--azul-esc); margin-bottom: 12px; }
  .login input {
    display: block; width: 100%; margin-top: 5px; padding: 12px 13px; border-radius: 10px;
    border: 1px solid var(--borda); background: #fffdf7; font-size: 1rem;
  }
  .erro { color: #c62828; font-size: .88rem; margin: 0 0 10px; text-align: center; }

  button {
    font: inherit; border: none; cursor: pointer; border-radius: 10px; font-weight: 800;
    padding: 12px 14px; font-size: .98rem;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-principal { width: 100%; background: var(--amarelo); color: #2a1f00; }
  .btn-levar { background: var(--azul); color: #fff; }
  .btn-entregue { background: var(--verde); color: #fff; }
  .btn-desistir { background: #fff; color: var(--fraco); border: 1px solid var(--borda); font-weight: 700; }

  /* ---------- Abas ---------- */
  .abas { display: flex; gap: 8px; max-width: 560px; margin: 4px auto 12px; }
  .aba {
    flex: 1 1 0; min-width: 0; background: #fff; color: var(--azul-esc); border: 2px solid var(--borda);
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; white-space: nowrap; font-size: .92rem;
  }
  .aba b { background: var(--creme-2); border-radius: 99px; padding: 1px 9px; font-size: .9rem; }
  .aba.ativa { border-color: var(--amarelo); background: #fffaf0; }
  .aba.ativa b { background: var(--amarelo); color: #2a1f00; }
  @media (max-width: 480px) {
    .aba { flex-direction: column; gap: 4px; padding: 8px 2px; font-size: .8rem; }
  }
  .busca {
    display: block; width: 100%; max-width: 420px; margin: 0 auto 16px; padding: 11px 13px;
    border-radius: 10px; border: 1px solid var(--borda); background: #fff; font-size: .96rem;
  }

  /* ---------- Cards ---------- */
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .pedido {
    background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 12px;
    box-shadow: 0 8px 22px rgba(20,64,121,.07); display: flex; flex-direction: column; gap: 10px;
  }
  .pedido.minha { border: 2px solid var(--azul); }
  .pedido.feita { opacity: .85; }
  .pedido-topo { display: flex; gap: 12px; align-items: center; }
  .pedido-topo img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--creme-2); flex: none; }
  .produto { font-size: .82rem; font-weight: 700; color: var(--fraco); text-transform: uppercase; letter-spacing: .3px; }
  .para { font-size: 1.25rem; font-weight: 900; color: var(--azul-esc); line-height: 1.15; word-break: break-word; }
  .equipe { font-weight: 700; font-size: .92rem; margin-top: 2px; }
  .detalhes { font-size: .88rem; color: var(--fraco); display: grid; gap: 2px; }
  .detalhes b { color: var(--texto); }
  .mensagem {
    margin: 0; background: #fffaf0; border-left: 4px solid var(--amarelo); border-radius: 6px;
    padding: 8px 10px; font-style: italic; font-size: .92rem; word-break: break-word;
  }
  .selo { display: inline-block; font-size: .8rem; font-weight: 800; border-radius: 99px; padding: 4px 10px; }
  .selo.caminho { background: rgba(30,90,168,.12); color: var(--azul-esc); }
  .selo.parado { background: rgba(229,57,53,.12); color: #b3261e; }
  .selo.feito { background: rgba(46,125,50,.14); color: var(--verde); }
  .acoes { display: flex; gap: 8px; }
  .acoes button { flex: 1; }
  .acoes .btn-desistir { flex: 0 0 auto; }
  .vazio { text-align: center; color: var(--fraco); padding: 40px 10px; grid-column: 1 / -1; }

  /* ---------- Confirmacao e aviso ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20,40,70,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-caixa { background: #fff; border-radius: 14px; padding: 22px; max-width: 380px; width: 100%; text-align: center; border-top: 6px solid var(--verde); }
  .modal-caixa .icone { font-size: 2.3rem; }
  .modal-caixa h3 { margin: 6px 0; color: var(--azul-esc); }
  .modal-caixa p { margin: 0 0 18px; color: var(--fraco); }
  .modal-botoes { display: flex; gap: 10px; }
  .modal-botoes button { flex: 1; }
  .aviso {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--azul-esc); color: #fff;
    font-weight: 700; padding: 12px 18px; border-radius: 12px; box-shadow: 0 8px 22px rgba(0,0,0,.25); z-index: 20; max-width: calc(100% - 32px);
  }
</style>
</head>
<body>
  <header>
    <div class="linha">
      <div class="icone" aria-hidden="true" id="txt-icone">📦</div>
      <div>
        <h1 id="txt-titulo">EAC Delivery</h1>
        <p id="txt-subtitulo">Entregas de rosas e botons</p>
      </div>
    </div>
  </header>
  <div class="faixa"></div>
  <div class="quem oculto" id="quem">
    <span><span id="txt-quem">🚚 Entregador:</span> <strong id="nome-atual"></strong><a href="#" id="trocar-nome">trocar nome</a></span>
    <a href="#" id="sair">sair</a>
  </div>

  <main>
    <form class="login oculto" id="tela-login">
      <h2 id="txt-login-titulo">🚚 Acesso dos entregadores</h2>
      <p id="txt-login-texto">Entre com a senha da Entrega e o seu nome.</p>
      <p class="erro oculto" id="login-erro"></p>
      <label>Seu nome
        <input type="text" id="nome" placeholder="Como os outros vão te ver" maxlength="40" autocomplete="name" required>
      </label>
      <label id="campo-senha"><span id="txt-senha">Senha da Entrega</span>
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
      </label>
      <button type="submit" class="btn-principal">Entrar</button>
    </form>

    <section id="tela-entregas" class="oculto">
      <div class="abas">
        <button type="button" class="aba ativa" data-aba="aEntregar"><span id="txt-aba-1">📦 A entregar</span> <b id="n-aEntregar">0</b></button>
        <button type="button" class="aba" data-aba="comigo"><span id="txt-aba-2">🚚 Comigo</span> <b id="n-comigo">0</b></button>
        <button type="button" class="aba" data-aba="entregues"><span id="txt-aba-3">✅ Entregues</span> <b id="n-entregues">0</b></button>
      </div>
      <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou equipe">
      <div class="grade" id="grade"></div>
    </section>
  </main>

  <div class="modal oculto" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-caixa">
      <div class="icone" id="modal-icone"></div>
      <h3 id="modal-titulo"></h3>
      <p id="modal-texto"></p>
      <div class="modal-botoes">
        <button type="button" class="btn-desistir" id="modal-nao"></button>
        <button type="button" class="btn-entregue" id="modal-sim"></button>
      </div>
    </div>
  </div>
  <div class="aviso oculto" id="aviso" role="status"></div>

<script>
  // Textos e conta de cada endereco. A API e a mesma, so muda o prefixo.
  const PAGINAS = {
    entregas: {
      usuario: 'entrega', api: '/entregas', chave: 'sessaoEntrega', chaveNome: 'nomeEntregador',
      tituloAba: 'EAC Delivery — Entregas', icone: '📦', titulo: 'EAC Delivery', subtitulo: 'Entregas de rosas e botons',
      quem: '🚚 Entregador:', loginTitulo: '🚚 Acesso dos entregadores', loginTexto: 'Entre com a senha da Entrega e o seu nome.',
      senha: 'Senha da Entrega', abas: ['📦 A entregar', '🚚 Comigo', '✅ Entregues'],
      novo: p => `📦 Novo pedido: ${p.produto} para ${p.para}`, novos: n => `📦 ${n} novos pedidos para entregar!`,
      vazioLivres: 'Nenhum pedido esperando entrega. 🎉',
      vazioComigo: 'Você não está levando nenhum pedido. Pegue um em "A entregar".',
      vazioFeitos: 'Nenhuma entrega feita ainda.',
      feitoPor: 'Entregue por', comVoce: '🚚 Com você', comOutro: '🚚 Com',
      btnPegar: '🚚 Estou levando', btnFeito: '✅ Entregue!',
      pegou: p => `🚚 ${p.produto} para ${p.para} está com você!`,
      confirmarIcone: '📦', confirmarTitulo: p => `Entregou para ${p.para}?`,
      confirmarTexto: p => `Confirme só depois de entregar ${p.produto}${p.equipe ? ' (' + p.equipe + ')' : ''}.`,
      confirmarSim: 'Sim, entreguei', feito: p => `✅ Entregue para ${p.para}!`,
      devolverTexto: p => `${p.produto} para ${p.para} volta para "A entregar" e outra pessoa pode levar.`,
      devolvido: p => `↩️ Pedido de ${p.para} voltou para "A entregar".`
    },
    trotes: {
      usuario: 'trote', api: '/trotes', chave: 'sessaoTrote', chaveNome: 'nomeTroteiro',
      tituloAba: 'EAC Trotes — Equipe dos trotes', icone: '🎭', titulo: 'EAC Trotes', subtitulo: 'Trotes para fazer no encontro',
      quem: '🎭 Na equipe:', loginTitulo: '🎭 Acesso da equipe dos trotes', loginTexto: 'Entre com a senha dos Trotes e o seu nome.',
      senha: 'Senha dos Trotes', abas: ['🎭 A fazer', '🏃 Comigo', '✅ Feitos'],
      novo: p => `🎭 Novo trote: ${p.produto} para ${p.para}`, novos: n => `🎭 ${n} novos trotes para fazer!`,
      vazioLivres: 'Nenhum trote esperando. 🎉',
      vazioComigo: 'Você não está fazendo nenhum trote. Pegue um em "A fazer".',
      vazioFeitos: 'Nenhum trote feito ainda.',
      feitoPor: 'Feito por', comVoce: '🏃 Com você', comOutro: '🏃 Com',
      btnPegar: '🎭 Estou indo', btnFeito: '✅ Trote feito!',
      pegou: p => `🏃 ${p.produto} para ${p.para} está com você!`,
      confirmarIcone: '🎭', confirmarTitulo: p => `Fez o trote em ${p.para}?`,
      confirmarTexto: p => `Confirme só depois de fazer o ${p.produto}${p.equipe ? ' (' + p.equipe + ')' : ''}.`,
      confirmarSim: 'Sim, trote feito', feito: p => `✅ Trote feito em ${p.para}!`,
      devolverTexto: p => `${p.produto} para ${p.para} volta para "A fazer" e outra pessoa pode ir.`,
      devolvido: p => `↩️ Trote de ${p.para} voltou para "A fazer".`
    }
  };
  const T = location.pathname.replace(/\/+$/, '') === '/trotes' ? PAGINAS.trotes : PAGINAS.entregas;
  document.title = T.tituloAba;
  for (const [id, texto] of [['txt-icone', T.icone], ['txt-titulo', T.titulo], ['txt-subtitulo', T.subtitulo],
    ['txt-quem', T.quem], ['txt-login-titulo', T.loginTitulo], ['txt-login-texto', T.loginTexto], ['txt-senha', T.senha],
    ['txt-aba-1', T.abas[0]], ['txt-aba-2', T.abas[1]], ['txt-aba-3', T.abas[2]]]) {
    document.getElementById(id).textContent = texto;
  }

  const CHAVE = T.chave;
  const CHAVE_NOME = T.chaveNome;
  let sessao = null;
  let nome = '';
  let pedidos = [];
  let abaAtual = 'aEntregar';
  let timer = null;
  let idsConhecidos = null;
  let confirmacaoAtual = null;

  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hora = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  const minutosDesde = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));

  function ler(chave) { try { return JSON.parse(localStorage.getItem(chave)); } catch { return null; } }
  function lerTexto(chave) { try { return localStorage.getItem(chave) || ''; } catch { return ''; } }

  function avisar(texto) {
    const el = $('aviso');
    el.textContent = texto;
    el.classList.remove('oculto');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => el.classList.add('oculto'), 4000);
  }

  async function api(caminho, opcoes = {}) {
    const res = await fetch('/api/admin' + caminho, {
      ...opcoes,
      headers: { ...(opcoes.headers || {}), Authorization: `Bearer ${sessao && sessao.token}` }
    });
    if (res.status === 401) { sair(); throw new Error('sessao'); }
    return res;
  }

  // ---------- Login (senha da Entrega + nome de quem entrega) ----------
  function mostrarLogin(soNome) {
    $('tela-login').classList.remove('oculto');
    $('tela-entregas').classList.add('oculto');
    $('quem').classList.add('oculto');
    $('campo-senha').classList.toggle('oculto', !!soNome);
    $('senha').required = !soNome;
    $('nome').value = nome;
    (nome ? $('senha') : $('nome')).focus();
  }

  $('tela-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const erro = $('login-erro');
    erro.classList.add('oculto');
    const nomeDigitado = $('nome').value.trim().replace(/\s+/g, ' ');
    if (nomeDigitado.length < 2) {
      erro.textContent = 'Digite o seu nome.';
      erro.classList.remove('oculto');
      return;
    }
    if (!sessao) {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario: T.usuario, senha: $('senha').value })
      });
      const dados = await res.json();
      if (!res.ok) {
        erro.textContent = 'Senha incorreta.';
        erro.classList.remove('oculto');
        return;
      }
      sessao = dados;
      try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch {}
      $('senha').value = '';
    }
    nome = nomeDigitado;
    try { localStorage.setItem(CHAVE_NOME, nome); } catch {}
    abrirEntregas();
  });

  function sair() {
    if (sessao && sessao.papel === T.usuario) {
      fetch('/api/admin/logout', { method: 'POST', headers: { Authorization: `Bearer ${sessao.token}` } }).catch(() => {});
      try { localStorage.removeItem(CHAVE); } catch {}
    }
    sessao = null;
    clearInterval(timer);
    mostrarLogin(false);
  }
  $('sair').addEventListener('click', ev => { ev.preventDefault(); sair(); });
  $('trocar-nome').addEventListener('click', ev => { ev.preventDefault(); clearInterval(timer); mostrarLogin(true); });

  // ---------- Pedidos ----------
  function abrirEntregas() {
    $('tela-login').classList.add('oculto');
    $('tela-entregas').classList.remove('oculto');
    $('quem').classList.remove('oculto');
    $('nome-atual').textContent = nome;
    carregar();
    clearInterval(timer);
    timer = setInterval(carregar, 5000);
  }

  async function carregar() {
    let res;
    try { res = await api(`${T.api}/pedidos`); } catch { return; }
    if (!res.ok) { avisar('Não foi possível carregar os pedidos.'); return; }
    pedidos = await res.json();
    const livres = pedidos.filter(p => p.situacao === 'livre');
    if (idsConhecidos) {
      const novos = livres.filter(p => !idsConhecidos.has(p.id));
      if (novos.length === 1) avisar(T.novo(novos[0]));
      else if (novos.length > 1) avisar(T.novos(novos.length));
    }
    idsConhecidos = new Set(pedidos.map(p => p.id));
    render();
  }

  const ehMeu = p => p.situacao === 'a_caminho' && p.comQuem === nome;

  function render() {
    const aEntregar = pedidos.filter(p => p.situacao !== 'entregue' && !ehMeu(p));
    const comigo = pedidos.filter(ehMeu);
    const entregues = pedidos.filter(p => p.situacao === 'entregue')
      .sort((a, b) => new Date(b.entregueEm) - new Date(a.entregueEm));
    $('n-aEntregar').textContent = aEntregar.filter(p => p.situacao === 'livre').length;
    $('n-comigo').textContent = comigo.length;
    $('n-entregues').textContent = entregues.length;

    const termo = $('busca').value.trim().toLowerCase();
    const lista = ({ aEntregar, comigo, entregues })[abaAtual]
      .filter(p => !termo || `${p.para} ${p.equipe}`.toLowerCase().includes(termo));

    if (!lista.length) {
      const vazio = termo ? 'Ninguém encontrado com essa busca.'
        : abaAtual === 'aEntregar' ? T.vazioLivres
        : abaAtual === 'comigo' ? T.vazioComigo
        : T.vazioFeitos;
      $('grade').innerHTML = `<div class="vazio">${vazio}</div>`;
      return;
    }
    $('grade').innerHTML = lista.map(card).join('');
  }

  function card(p) {
    let situacao = '';
    let acoes = '';
    if (p.situacao === 'entregue') {
      situacao = `<span class="selo feito">✅ ${T.feitoPor} ${esc(p.entreguePor || '—')} às ${hora(p.entregueEm)}</span>`;
    } else if (ehMeu(p)) {
      situacao = `<span class="selo caminho">${T.comVoce}</span>`;
      acoes = `<button type="button" class="btn-entregue" onclick="confirmarEntregue(${Number(p.id)})">${T.btnFeito}</button>
               <button type="button" class="btn-desistir" onclick="confirmarDesistir(${Number(p.id)})">Desistir</button>`;
    } else if (p.situacao === 'a_caminho' && p.reservaAtiva) {
      situacao = `<span class="selo caminho">${T.comOutro} ${esc(p.comQuem)}</span>`;
    } else {
      if (p.situacao === 'a_caminho') {
        situacao = `<span class="selo parado">⏳ Estava com ${esc(p.comQuem)} — pode pegar</span>`;
      }
      acoes = `<button type="button" class="btn-levar" onclick="levar(${Number(p.id)})">${T.btnPegar}</button>`;
    }
    return `
      <article class="pedido${ehMeu(p) ? ' minha' : ''}${p.situacao === 'entregue' ? ' feita' : ''}">
        <div class="pedido-topo">
          ${p.foto ? `<img src="${esc(p.foto)}" alt="">` : ''}
          <div>
            <div class="produto">${esc(p.produto)}</div>
            <div class="para">${esc(p.para)}</div>
            <div class="equipe">👥 ${p.equipe ? esc(p.equipe) : 'Equipe não informada'}</div>
          </div>
        </div>
        <div class="detalhes">
          <span>💌 De: <b>${p.de ? esc(p.de) : 'Anônimo 🕵️'}</b></span>
          <span>🧾 ${esc(p.codigo || '#' + p.id)} · pedido às ${hora(p.criadoEm)}</span>
        </div>
        ${p.mensagem ? `<p class="mensagem">“${esc(p.mensagem)}”</p>` : ''}
        ${situacao ? `<div>${situacao}</div>` : ''}
        ${acoes ? `<div class="acoes">${acoes}</div>` : ''}
      </article>`;
  }

  async function enviar(caminho, sucesso, erroPadrao) {
    const res = await api(caminho, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entregador: nome })
    });
    const dados = await res.json();
    avisar(res.ok ? sucesso : (dados.erro || erroPadrao));
    return res.ok;
  }

  async function levar(id) {
    const p = pedidos.find(x => x.id === id);
    if (!p) return;
    try {
      const ok = await enviar(`${T.api}/pedidos/${id}/levar`, T.pegou(p), 'Erro ao pegar o pedido.');
      if (ok) trocarAba('comigo');
    } catch {}
    carregar();
  }

  // ---------- Confirmacoes ----------
  function pedirConfirmacao({ icone, titulo, texto, sim, nao, acao }) {
    confirmacaoAtual = { acao };
    $('modal-icone').textContent = icone;
    $('modal-titulo').textContent = titulo;
    $('modal-texto').textContent = texto;
    $('modal-sim').textContent = sim;
    $('modal-nao').textContent = nao;
    $('modal').classList.remove('oculto');
    $('modal-sim').focus();
  }
  function fecharModal() { $('modal').classList.add('oculto'); confirmacaoAtual = null; }
  $('modal-nao').addEventListener('click', fecharModal);
  $('modal').addEventListener('click', ev => { if (ev.target === $('modal')) fecharModal(); });
  $('modal-sim').addEventListener('click', async () => {
    if (!confirmacaoAtual) return;
    const { acao } = confirmacaoAtual;
    $('modal-sim').disabled = true;
    try { await acao(); } catch {}
    $('modal-sim').disabled = false;
    fecharModal();
    carregar();
  });

  function confirmarEntregue(id) {
    const p = pedidos.find(x => x.id === id);
    if (!p) return;
    pedirConfirmacao({
      icone: T.confirmarIcone,
      titulo: T.confirmarTitulo(p),
      texto: T.confirmarTexto(p),
      sim: T.confirmarSim, nao: 'Ainda não',
      acao: () => enviar(`${T.api}/pedidos/${id}/entregar`, T.feito(p), 'Erro ao marcar como feito.')
    });
  }

  function confirmarDesistir(id) {
    const p = pedidos.find(x => x.id === id);
    if (!p) return;
    pedirConfirmacao({
      icone: '↩️',
      titulo: 'Devolver este pedido?',
      texto: T.devolverTexto(p),
      sim: 'Sim, devolver', nao: 'Cancelar',
      acao: () => enviar(`${T.api}/pedidos/${id}/desistir`, T.devolvido(p), 'Erro ao devolver o pedido.')
    });
  }

  // ---------- Abas e busca ----------
  function trocarAba(aba) {
    abaAtual = aba;
    document.querySelectorAll('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === aba));
    render();
  }
  document.querySelectorAll('.aba').forEach(btn => btn.addEventListener('click', () => trocarAba(btn.dataset.aba)));
  $('busca').addEventListener('input', render);

  // ---------- Inicio ----------
  (async () => {
    nome = lerTexto(CHAVE_NOME);
    // Conta da pagina salva, ou o admin ja logado no painel.
    for (const chave of [CHAVE, 'sessaoAdmin']) {
      const salva = ler(chave);
      if (!salva || !salva.token) continue;
      const res = await fetch('/api/admin/me', { headers: { Authorization: `Bearer ${salva.token}` } });
      if (!res.ok) { if (chave === CHAVE) { try { localStorage.removeItem(CHAVE); } catch {} } continue; }
      const me = await res.json();
      if (me.papel !== T.usuario && me.papel !== 'admin') continue;
      sessao = { ...salva, papel: me.papel };
      if (nome) abrirEntregas(); else mostrarLogin(true);
      return;
    }
    mostrarLogin(false);
  })();
</script>
</body>
</html>
