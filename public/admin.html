<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — EAC Santo Antônio</title>
<link rel="icon" type="image/svg+xml" href="/logo-eac.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="eac-header">
  <div class="eac-topo">
    <img class="eac-logo" src="/logo-eac.svg" alt="Logo EAC">
    <div class="eac-titulo" style="flex:1">
      <h1>Painel Admin — EAC Santo Antônio</h1>
      <p>Gestão dos trotes, rosas e entregas do encontro</p>
    </div>
    <nav><a href="/">&larr; Ver loja</a></nav>
  </div>
</header>
<div class="eac-faixa"></div>

<main style="max-width: 1100px;">

  <section>
    <h2>Resumo</h2>
    <div class="resumo" id="resumo"></div>
  </section>

  <section class="card">
    <h2>Todos os pedidos</h2>

    <div class="filtros">
      <label style="margin:0;">
        Status
        <select id="filtro-status" class="small">
          <option value="todos">Todos</option>
          <option value="pendente_pagamento">Aguardando pagamento</option>
          <option value="pago">Pago</option>
          <option value="aguardando">Aguardando entrega</option>
          <option value="entregue">Entregue</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </label>
      <label style="margin:0;">
        Categoria
        <select id="filtro-categoria" class="small">
          <option value="todos">Todas</option>
        </select>
      </label>
      <label style="margin:0;">
        Buscar
        <input id="filtro-busca" type="text" placeholder="Comprador ou destinatário" style="width:220px;">
      </label>
      <div style="align-self:flex-end;">
        <button class="secundario" onclick="carregarPedidos()">Atualizar agora</button>
      </div>
    </div>

    <div class="tabela-wrap">
      <table id="tabela-pedidos">
        <thead>
          <tr>
            <th>Ticket</th>
            <th>Categoria</th>
            <th>Produto</th>
            <th>Comprador</th>
            <th>Destinatário</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Entregador</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
  </section>

</main>

<footer class="eac-rodape">
  EAC Santo Antônio &middot; painel de gestão
</footer>

<script src="admin.js"></script>
</body>
</html>
